# Checks TANGHALAN VR's rules and simulations on every push: the tests (the same ones Unity's Test Runner
# runs) and the numbers shared by Unity, GAMA and the reference flood model.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Rules and simulation tests
        run: dotnet test Tests
      - name: The same numbers in Unity, GAMA and the reference model
        run: python3 Tools/check_constants.py
      - name: The reference flood model still gives the recorded results
        run: python3 Tools/flood-reference/check_reference.py
